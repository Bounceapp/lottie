packages:
  - example
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Its postinstall only runs `lefthook install`, which `prepare` already does.
  lefthook: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@storybook/builder-vite@10.6.7'
  - '@storybook/react-dom-shim@10.6.7'
  - '@storybook/react-native-web-vite@10.6.7'
  - '@storybook/react-vite@10.6.7'
  - '@storybook/react@10.6.7'
  - storybook@10.6.7
  - vite@8.3.8
  - '@storybook/addon-mcp@10.6.7'
